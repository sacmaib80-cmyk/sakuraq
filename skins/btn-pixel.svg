<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 54" preserveAspectRatio="none" role="img" aria-label="Pixel Quest button skin">
<!--
  สกินปุ่ม "เควสพิกเซล" — วาดมือทีละบล็อก 4px ไม่ใช้ gradient เลยสักจุด
  กฎที่ยึด: ทุกขอบลงล็อกกริด 4px · ไล่เฉดด้วย dither (ตาหมากรุกแถวเดียว) ไม่ใช่ไล่สี
           · มุมเป็นบันไดแบบเกมเก่า ไม่ใช่ border-radius
           · ของประดับต้องอ่านออกที่ขนาดจริง (ดาว) ไม่ใช่กากบาท
  สีเปลี่ยนได้ผ่านตัวแปร --sk-*
-->
<defs>
  <clipPath id="skPixClip">
    <path d="M8 0h304v4h4v4h4v38h-4v4h-4v4H8v-4H4v-4H0V8h4V4h4z"/>
  </clipPath>
</defs>

<g clip-path="url(#skPixClip)">
  <!-- พื้น 2 โทน -->
  <rect x="0" y="0"  width="320" height="24" fill="var(--sk-body-1,#4a7ee0)"/>
  <rect x="0" y="24" width="320" height="30" fill="var(--sk-body-2,#2c50ad)"/>

  <!-- ดาวพิกเซลในพื้น (จุดเดี่ยว วางไม่เป็นระเบียบ) -->
  <g fill="var(--sk-spark,#eaf3ff)" opacity=".16">
    <rect x="68"  y="8"  width="4" height="4"/><rect x="112" y="16" width="4" height="4"/>
    <rect x="156" y="4"  width="4" height="4"/><rect x="196" y="12" width="4" height="4"/>
    <rect x="236" y="8"  width="4" height="4"/><rect x="92"  y="36" width="4" height="4"/>
    <rect x="140" y="44" width="4" height="4"/><rect x="188" y="36" width="4" height="4"/>
    <rect x="232" y="44" width="4" height="4"/><rect x="264" y="34" width="4" height="4"/>
  </g>

  <!-- แถบ dither: ตาหมากรุกแถวเดียวตรงรอยต่อ 2 โทน -->
  <g fill="var(--sk-body-1,#4a7ee0)">
    <rect x="0"   y="24" width="4" height="4"/><rect x="8"   y="24" width="4" height="4"/>
    <rect x="16"  y="24" width="4" height="4"/><rect x="24"  y="24" width="4" height="4"/>
    <rect x="32"  y="24" width="4" height="4"/><rect x="40"  y="24" width="4" height="4"/>
    <rect x="48"  y="24" width="4" height="4"/><rect x="56"  y="24" width="4" height="4"/>
    <rect x="64"  y="24" width="4" height="4"/><rect x="72"  y="24" width="4" height="4"/>
    <rect x="80"  y="24" width="4" height="4"/><rect x="88"  y="24" width="4" height="4"/>
    <rect x="96"  y="24" width="4" height="4"/><rect x="104" y="24" width="4" height="4"/>
    <rect x="112" y="24" width="4" height="4"/><rect x="120" y="24" width="4" height="4"/>
    <rect x="128" y="24" width="4" height="4"/><rect x="136" y="24" width="4" height="4"/>
    <rect x="144" y="24" width="4" height="4"/><rect x="152" y="24" width="4" height="4"/>
    <rect x="160" y="24" width="4" height="4"/><rect x="168" y="24" width="4" height="4"/>
    <rect x="176" y="24" width="4" height="4"/><rect x="184" y="24" width="4" height="4"/>
    <rect x="192" y="24" width="4" height="4"/><rect x="200" y="24" width="4" height="4"/>
    <rect x="208" y="24" width="4" height="4"/><rect x="216" y="24" width="4" height="4"/>
    <rect x="224" y="24" width="4" height="4"/><rect x="232" y="24" width="4" height="4"/>
    <rect x="240" y="24" width="4" height="4"/><rect x="248" y="24" width="4" height="4"/>
    <rect x="256" y="24" width="4" height="4"/><rect x="264" y="24" width="4" height="4"/>
    <rect x="272" y="24" width="4" height="4"/><rect x="280" y="24" width="4" height="4"/>
    <rect x="288" y="24" width="4" height="4"/><rect x="296" y="24" width="4" height="4"/>
    <rect x="304" y="24" width="4" height="4"/><rect x="312" y="24" width="4" height="4"/>
  </g>

  <!-- ไฟหน้าบน 1 แถว + เงาขอบล่าง 1 แถว -->
  <rect x="0" y="0"  width="320" height="4" fill="var(--sk-lite,#a7ccff)"/>
  <rect x="0" y="50" width="320" height="4" fill="var(--sk-dark,#16307a)"/>

  <!-- ดาวพิกเซล 5 แฉก ซ้าย/ขวา (กริด 4px ล้วน) -->
  <g fill="var(--sk-gem,#ffd36b)"><rect x="18" y="16" width="4" height="4"/><rect x="14" y="20" width="12" height="4"/><rect x="10" y="24" width="20" height="4"/><rect x="14" y="28" width="12" height="4"/><rect x="10" y="32" width="4" height="4"/><rect x="26" y="32" width="4" height="4"/></g>
  <rect x="18" y="24" width="4" height="4" fill="var(--sk-spark,#fff6dd)"/>
  <g fill="var(--sk-gem-2,#7fe6cf)"><rect x="300" y="18" width="4" height="4"/><rect x="296" y="22" width="12" height="4"/><rect x="292" y="26" width="20" height="4"/><rect x="296" y="30" width="12" height="4"/><rect x="292" y="34" width="4" height="4"/><rect x="308" y="34" width="4" height="4"/></g>
  <rect x="300" y="26" width="4" height="4" fill="var(--sk-spark,#eafffa)"/>
</g>

<!-- ขอบนอกครีม 4px -->
<path d="M8 0h304v4h4v4h4v38h-4v4h-4v4H8v-4H4v-4H0V8h4V4h4z
         M12 4v4H8v4H4v30h4v4h4v4h296v-4h4v-4h4V12h-4V8h-4V4z"
      fill="var(--sk-edge,#f6e7c4)" fill-rule="evenodd"/>
<!-- เงาของขอบครีม (ให้ขอบมีความหนา) -->
<path d="M12 4h296v4h4v4h4v30h-4v4h-4v4H12v-4H8v-4H4V12h4V8h4z
         M16 8v4h-4v4H8v22h4v4h4v4h288v-4h4v-4h4V16h-4v-4h-4V8z"
      fill="var(--sk-edge-2,#b8925a)" fill-rule="evenodd" opacity=".5"/>
</svg>
