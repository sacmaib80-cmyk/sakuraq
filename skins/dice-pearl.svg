<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="Abyss pearl dice skin">
<!-- ลูกเต๋าเปลือกหอยมุกใต้สมุทร — ลูกบาศก์มุมมองไอโซเมตริก
     แต่ละหน้าคนละเฉด (มุกเหลือบ) เพื่อให้อ่านออกว่าเป็นก้อน 3 มิติ ตอนย่อเหลือ 60px
     แต้มเป็นไข่มุกฝังในเบ้า ไม่ใช่จุดทึบ -->
<defs>
<linearGradient id="dpTop" x1="0" y1="0" x2=".7" y2="1">
<stop offset="0"   stop-color="var(--dp-top-1,#fff7fb)"/>
<stop offset=".42" stop-color="var(--dp-top-2,#d9f4f0)"/>
<stop offset="1"   stop-color="var(--dp-top-3,#a8d8ea)"/>
</linearGradient>
<linearGradient id="dpLeft" x1="0" y1="0" x2=".45" y2="1">
<stop offset="0"   stop-color="var(--dp-left-1,#8fd6d8)"/>
<stop offset=".52" stop-color="var(--dp-left-2,#4e9fb0)"/>
<stop offset="1"   stop-color="var(--dp-left-3,#2c6f87)"/>
</linearGradient>
<linearGradient id="dpRight" x1="0" y1="0" x2=".6" y2="1">
<stop offset="0"   stop-color="var(--dp-right-1,#9a9fe0)"/>
<stop offset=".5"  stop-color="var(--dp-right-2,#5766a8)"/>
<stop offset="1"   stop-color="var(--dp-right-3,#2f3c72)"/>
</linearGradient>
<radialGradient id="dpPearl" cx=".34" cy=".28" r=".8">
<stop offset="0"   stop-color="var(--dp-pearl-hi,#ffffff)"/>
<stop offset=".52" stop-color="var(--dp-pearl,#e8fdff)"/>
<stop offset="1"   stop-color="var(--dp-pearl-lo,#8fc3d4)"/>
</radialGradient>
<radialGradient id="dpGlow" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="var(--dp-glow,#67e8f9)" stop-opacity=".5"/>
<stop offset="1" stop-color="var(--dp-glow,#67e8f9)" stop-opacity="0"/>
</radialGradient>
</defs>

<!-- แสงเรืองชีวภาพใต้ก้อน (ทำให้ก้อนไม่ลอยเคว้ง) -->
<ellipse cx="36" cy="66" rx="26" ry="6" fill="url(#dpGlow)"/>

<!-- ตัวลูกบาศก์ -->
<path d="M36 8 64 24 36 40 8 24z"   fill="url(#dpTop)"/>
<path d="M8 24 36 40v26L8 50z"      fill="url(#dpLeft)"/>
<path d="M64 24 36 40v26l28-16z"    fill="url(#dpRight)"/>

<!-- ลายมุกไล่คลื่นบนหน้าบน (เนื้อหอย ไม่ใช่ผิวพลาสติกเรียบ) -->
<g fill="none" stroke="var(--dp-iris-1,#ffc4e6)" stroke-width="1.2" opacity=".6">
<path d="M15 24c7-5 14-7 19-4 5 3 12 2 19-3"/>
<path d="M21 29c5-3 11-5 15-3 5 2 10 1 15-2"/>
</g>
<g fill="none" stroke="var(--dp-iris-2,#9ff0dc)" stroke-width="1" opacity=".55">
<path d="M12 21c8-6 17-8 22-5 6 3 13 1 21-4"/>
</g>

<!-- คมขอบรับแสง / ขอบเงา -->
<g stroke="var(--dp-edge,#ffffff)" stroke-width="1.4" stroke-linecap="round" fill="none" opacity=".8">
<path d="M8 24 36 8l28 16"/>
</g>
<g stroke="var(--dp-edge-lo,#1d4a5e)" stroke-width="1.2" fill="none" opacity=".45">
<path d="M36 40v26M8 24v26M64 24v26M8 50l28 16M64 50L36 66"/>
</g>

<!-- แต้ม 4 บนหน้าซ้าย -->
<g>
<g transform="rotate(30 15.6 35.3)"><ellipse cx="15.6" cy="35.3" rx="4.4" ry="3.4" fill="var(--dp-socket,#1d4a5e)" opacity=".55"/><ellipse cx="15.6" cy="34.7" rx="3.5" ry="2.6" fill="url(#dpPearl)"/></g>
<g transform="rotate(30 28.4 42.7)"><ellipse cx="28.4" cy="42.7" rx="4.4" ry="3.4" fill="var(--dp-socket,#1d4a5e)" opacity=".55"/><ellipse cx="28.4" cy="42.1" rx="3.5" ry="2.6" fill="url(#dpPearl)"/></g>
<g transform="rotate(30 15.6 47.3)"><ellipse cx="15.6" cy="47.3" rx="4.4" ry="3.4" fill="var(--dp-socket,#1d4a5e)" opacity=".55"/><ellipse cx="15.6" cy="46.7" rx="3.5" ry="2.6" fill="url(#dpPearl)"/></g>
<g transform="rotate(30 28.4 54.7)"><ellipse cx="28.4" cy="54.7" rx="4.4" ry="3.4" fill="var(--dp-socket,#1d4a5e)" opacity=".55"/><ellipse cx="28.4" cy="54.1" rx="3.5" ry="2.6" fill="url(#dpPearl)"/></g>
</g>

<!-- แต้ม 2 บนหน้าขวา -->
<g>
<g transform="rotate(-30 55.6 36.6)"><ellipse cx="55.6" cy="36.6" rx="4" ry="3.1" fill="var(--dp-socket-2,#141c42)" opacity=".55"/><ellipse cx="55.6" cy="36" rx="3.2" ry="2.4" fill="url(#dpPearl)"/></g>
<g transform="rotate(-30 44.4 53.4)"><ellipse cx="44.4" cy="53.4" rx="4" ry="3.1" fill="var(--dp-socket-2,#141c42)" opacity=".55"/><ellipse cx="44.4" cy="52.8" rx="3.2" ry="2.4" fill="url(#dpPearl)"/></g>
</g>

<!-- ไข่มุกเม็ดใหญ่บนหน้าบน (แต้ม 1) -->
<g>
<ellipse cx="36" cy="24" rx="7.4" ry="4.4" fill="var(--dp-socket-3,#5e9aa6)" opacity=".45"/>
<ellipse cx="36" cy="23.1" rx="6.2" ry="3.7" fill="url(#dpPearl)"/>
<ellipse cx="33.8" cy="21.8" rx="2" ry="1.1" fill="#ffffff" opacity=".9"/>
</g>

<!-- แสงกวาดผิวมุกบนหน้าบน -->
<path class="dpSheen" d="M36 8 64 24 36 40 8 24z" fill="var(--dp-sheen,#ffffff)" opacity=".16"/>

<!-- ฟองอากาศเม็ดเล็ก -->
<g class="dpBubs" fill="none" stroke="var(--dp-bub,#dcfcff)" stroke-width="1.5">
<circle class="dpBub dpBub1" cx="64" cy="13" r="2.8" opacity=".85"/>
<circle class="dpBub dpBub2" cx="10" cy="9"  r="1.9" opacity=".7"/>
<circle class="dpBub dpBub3" cx="69" cy="32" r="1.6" opacity=".55"/>
</g>
</svg>
