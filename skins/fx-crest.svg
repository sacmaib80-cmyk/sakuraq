<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Royal seal tap effect">
<!-- เอฟเฟกต์ตอนแตะจอ: ตราประทับทอง — ช่อลอเรลผลิออก 2 ข้าง + ดาวตราวาบกลาง + วงแหวนทองแผ่ + เกล็ดทองกระเด็น
     ใช้ทอง + ไฮไลต์ครีม จะได้เห็นทั้งบนพื้นสว่าง (ลานอิฐ) และพื้นเข้ม (ปุ่ม/แถบเมนู)
     ทุก class ถูกขับด้วย CSS (.sq-tap-crest …) ไม่มีอนิเมชั่นในไฟล์นี้ -->
<defs>
<radialGradient id="fcGlow" cx=".5" cy=".5" r=".5">
<stop offset="0"   stop-color="var(--fc-glow,#FBEEBE)" stop-opacity=".6"/>
<stop offset=".55" stop-color="var(--fc-glow,#E7C471)" stop-opacity=".18"/>
<stop offset="1"   stop-color="var(--fc-glow,#E7C471)" stop-opacity="0"/>
</radialGradient>
<linearGradient id="fcGold" x1="0" y1="0" x2=".3" y2="1">
<stop offset="0"   stop-color="var(--fc-1,#FDF3D2)"/>
<stop offset=".45" stop-color="var(--fc-2,#E7C471)"/>
<stop offset="1"   stop-color="var(--fc-3,#A97C2E)"/>
</linearGradient>
</defs>

<circle class="fcHalo" cx="32" cy="32" r="18" fill="url(#fcGlow)"/>

<!-- วงแหวนทอง 2 ชั้นแผ่ออก -->
<g fill="none" stroke="url(#fcGold)" stroke-linecap="round">
<circle class="fcRing fcRing1" cx="32" cy="32" r="10" stroke-width="2.6"/>
<circle class="fcRing fcRing2" cx="32" cy="32" r="14" stroke-width="1.4" stroke-dasharray="3 5"/>
</g>

<!-- ช่อลอเรลผลิออก 2 ข้าง -->
<g class="fcWreath" fill="url(#fcGold)">
<g class="fcLeafL">
<path d="M32 44c-9-2-14-9-14-18 8 2 13 9 14 18z"/>
<path d="M30 36c-7-1-11-6-11-13 6 2 10 6 11 13z" opacity=".72"/>
</g>
<g class="fcLeafR">
<path d="M32 44c9-2 14-9 14-18-8 2-13 9-14 18z"/>
<path d="M34 36c7-1 11-6 11-13-6 2-10 6-11 13z" opacity=".72"/>
</g>
</g>

<!-- ตราดาวกลาง -->
<g class="fcStar">
<path d="M32 18l3.4 7 7.6 1.1-5.5 5.3 1.3 7.6-6.8-3.6-6.8 3.6 1.3-7.6-5.5-5.3 7.6-1.1z" fill="url(#fcGold)"/>
<path d="M32 22.6l1.9 3.9 4.3.6-3.1 3 .7 4.3-3.8-2z" fill="var(--fc-1,#FFF8E2)" opacity=".75"/>
</g>

<!-- เกล็ดทองกระเด็น (ทรงข้าวหลามตัด อ่านออกตอนย่อ) -->
<g class="fcSparks" fill="url(#fcGold)">
<path class="fcSpark fcSpark1" d="M32 32l3 5-3 5-3-5z"/>
<path class="fcSpark fcSpark2" d="M32 32l3 5-3 5-3-5z"/>
<path class="fcSpark fcSpark3" d="M32 32l3 5-3 5-3-5z"/>
<path class="fcSpark fcSpark4" d="M32 32l2.6 4.3-2.6 4.3-2.6-4.3z"/>
<path class="fcSpark fcSpark5" d="M32 32l2.6 4.3-2.6 4.3-2.6-4.3z"/>
<path class="fcSpark fcSpark6" d="M32 32l2.6 4.3-2.6 4.3-2.6-4.3z"/>
</g>

<!-- ริบบิ้นใต้ตรา -->
<g class="fcRibbon" fill="var(--fc-rib,#B4304A)">
<path d="M26 44l6 3 6-3 1 6-7 3-7-3z"/>
<path d="M32 47l6-3 1 6-7 3z" fill="var(--fc-rib2,#8E1F32)" opacity=".8"/>
</g>
</svg>
