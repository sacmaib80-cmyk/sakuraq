<svg xmlns="http://www.w3.org/2000/svg" viewBox="62 50 176 188" role="img" aria-label="Ink landscape painted by the timer">
<!-- ภาพหมึกที่ถูกวาดขึ้นตามเวลา (ชุดหอพระจันทร์)
     viewBox ตั้งเป็นช่วงเดียวกับช่องกระดาษของ timer-scroll.svg (x 62-238 / y 50-238)
     จึงวางทับได้ตรงๆ โดยไม่ต้องชดเชยเปอร์เซ็นต์
     ทุกกลุ่มถูกเปิดทีละชั้นด้วยตัวแปร rt-progress ใน index.html (บล็อก TIMER THEME: INK SCROLL)
     ลำดับ: ภูเขาไกล -> ภูเขาใกล้ -> หมอก -> ตลิ่ง -> ต้นสน -> เรือ -> นก -> ลายเซ็น -> ตราแดง

     ═══ เขตหวงห้าม (วัดจากแอปจริง ไม่ได้กะเอา) ═══
     ตัวเลขเวลา  กิน y 113-146 เต็มความกว้าง
     ป้ายเซสชัน  กิน y 156-187 เฉพาะ x 111-189
     -> ห้ามวางอะไรใน y 113-146 เด็ดขาด
     -> ช่วง y 146-190 วางได้เฉพาะ x<111 (ต้นสนอยู่ฝั่งซ้ายด้วยเหตุผลนี้ ไม่ใช่เพราะสวย)
     -> ต่ำกว่า y 190 ใช้ได้เต็มความกว้าง
     ⚠️ รอบแรกวางภูเขาลงมาถึง y 140 กับตลิ่งที่ y 178 -> เปิดในแอปจริงแล้วตัวเลขทับภูเขา
        และป้ายเซสชันทับต้นสนจนอ่านไม่ออกทั้งคู่ (assert ผ่านหมด เห็นเพราะเปิดภาพดู)
     ที่ว่างกลางภาพนี้ไม่ใช่ข้อจำกัดที่ต้องทน — ภาพภูมิทัศน์จีนเว้นที่ว่างกลางภาพอยู่แล้ว (留白)
     ⚠️ ภูเขาชั้นไกลต้องจางกว่าชั้นใกล้เสมอ ถ้าเข้มเท่ากันจะแบนเป็นฟันเลื่อยชั้นเดียว -->

<!-- ═══ นกสองตัว : ตัวบอกมาตราส่วนว่าภูเขาข้างล่างใหญ่มาก ═══ -->
<g class="tsLayer tsBirds">
<g stroke="var(--ts-ink,#26242B)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".6">
<path d="M158 66l7-4.4 7 4.4M188 59l6-3.6 6 3.6"/>
</g>
</g>

<!-- ═══ ภูเขาไกล ═══ -->
<g class="tsLayer tsFar" fill="var(--ts-ink,#26242B)">
<path d="M62 106 84 63 98 82 116 60 136 84 150 70 172 92 192 68 214 96 236 106z" opacity=".22"/>
</g>

<!-- ═══ ภูเขาใกล้ ═══ -->
<g class="tsLayer tsMid" fill="var(--ts-ink,#26242B)">
<path d="M62 112 82 82 96 95 114 78 132 97 148 87 168 103 190 85 212 101 236 112z" opacity=".42"/>
</g>

<!-- ═══ หมอกคาดกลางภูเขา : แถบนุ่มหลายชั้น ไม่ใช่แถบทึบเส้นเดียว (แถบทึบอ่านเป็นรอยลบ) ═══ -->
<g class="tsLayer tsMist" fill="var(--ts-paper,#EDE1C6)">
<rect x="60" y="96" width="180" height="12" rx="6" opacity=".64"/>
<rect x="60" y="106" width="180" height="7" rx="3.5" opacity=".44"/>
<rect x="60" y="88" width="180" height="5" rx="2.5" opacity=".26"/>
</g>

<!-- ═══ ศาลาริมน้ำ (亭) : อยู่ฝั่งซ้ายเพราะป้ายเซสชันกินกลางจอ (x 111-189) ═══
     ⚠️ ตรงนี้เคยวาดเป็น "ต้นสน" 2 รอบแล้วอ่านไม่ออกทั้งสองรอบ (อ่านเป็นรอยขีดฆ่า)
        กฎในไฟล์ _ART-PROCESS ข้อ 8.4 บอกว่าของที่พัง 2 รอบให้เปลี่ยน ไม่ใช่วาดรอบที่ 3
        ศาลาอ่านง่ายกว่ามากที่ขนาดนี้เพราะเงาของมันไม่พ้องกับอะไรเลย
        (หลังคาโค้งปลายเชิดขึ้น + เสาเรียงเป็นตับ = จีนทันทีโดยไม่ต้องมีรายละเอียด)
        และมันคือ "หอ" เดียวกับชื่อชุด = ภาพในม้วนนี้คือที่ที่มาสคอตนั่งอยู่ -->
<g class="tsLayer tsPine">
<!-- ปลายชายคาเชิดขึ้นถูกวาดรวมอยู่ในเงาของหลังคาเลย ไม่ได้แยกเป็นเส้นต่างหาก
     ตอนแยกเป็นเส้นมันลอยหลุดออกมาอ่านเป็น "ตะขอ" และยังล้ำเข้าเขตป้ายเซสชันด้วย -->
<path d="M87 151C98 155 106 168 110 182 110 176 108 174 102 174 95 173 92 173 87 173 82 173 79 173 72 174 66 174 64 176 64 182 68 168 76 155 87 151z" fill="var(--ts-ink,#26242B)" opacity=".85"/>
<path d="M87 151v-6" stroke="var(--ts-ink,#26242B)" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="87" cy="144" r="2.4" fill="var(--ts-ink,#26242B)" opacity=".85"/>
<g stroke="var(--ts-ink,#26242B)" stroke-width="2" stroke-linecap="round" opacity=".8">
<path d="M71 175v30M80 174v31M94 174v31M103 175v30"/>
</g>
<g stroke="var(--ts-ink,#26242B)" stroke-width="1.5" stroke-linecap="round" opacity=".6">
<path d="M69 193h36M75 193v8M87 193v8M99 193v8"/>
</g>
<path d="M66 205h42l4 6H62z" fill="var(--ts-ink,#26242B)" opacity=".7"/>
</g>

<!-- ═══ ตลิ่ง + เส้นน้ำ (อยู่ใต้ป้ายเซสชันทั้งหมด) ═══ -->
<g class="tsLayer tsShore">
<path d="M62 213l22-16 15 9 18-11 16 12 17-9 18 11 20-8 26 12 22 5v9H62z" fill="var(--ts-ink,#26242B)" opacity=".72"/>
<g stroke="var(--ts-ink,#26242B)" stroke-width="1.1" stroke-linecap="round" opacity=".3" fill="none">
<path d="M78 228h34M132 231h30M180 227h32"/>
</g>
</g>

<!-- ═══ เรือลำเล็ก : ท้องเรือโค้ง + หลังคาโค้ง = อ่านออกว่าเป็นเรือ ไม่ใช่ขีดสองขีด ═══ -->
<!-- ⚠️ เรือต้องอยู่ "บนผืนน้ำ" ไม่ใช่บนสันตลิ่ง รอบแรกวางไว้ y 207 ซึ่งทับตลิ่งพอดี
     อ่านเป็นรอยโค้งบนภูเขา -> ย้ายมาอยู่ขวาของป้ายเซสชัน (x>189) ในน้ำโล่งแทน -->
<g class="tsLayer tsBoat">
<g stroke="var(--ts-ink,#26242B)" stroke-width="1.8" stroke-linecap="round" fill="none">
<path d="M196 175q14 7 27 0"/>
<path d="M204 173q6-8 12-1"/>
<path d="M210 165v-5"/>
</g>
<g stroke="var(--ts-ink,#26242B)" stroke-width="1" stroke-linecap="round" opacity=".28" fill="none">
<path d="M192 182h34"/>
</g>
</g>

<!-- ═══ ลายเซ็นด้วยหมึก (款识) : ขีดตั้งสั้นๆ เรียงเป็นคอลัมน์ ไม่ใช่เส้นหวัด ═══ -->
<g class="tsLayer tsSign">
<g stroke="var(--ts-ink,#26242B)" stroke-width="1.6" stroke-linecap="round" opacity=".76">
<path d="M203 199v7M203 210v5M203 219v8M209 200v10M209 214v6M209 224v4"/>
</g>
</g>

<!-- ═══ ตราชาดแดง : ประทับเมื่อเวลาหมดเท่านั้น = รางวัลของช่วงท้าย ═══
     สีแดงชิ้นเดียวในภาพ ตรงกับกฎกลางของชุด (แดง = ของที่ยืนยัน/จบแล้ว)
     ลายในตราเป็นชุดเดียวกับหน้าตราบนลูกเต๋าหยกและตราบนภาพที่แขวนอยู่ในฉากหน้า Home -->
<g class="tsLayer tsSeal">
<rect x="215" y="206" width="19" height="19" rx="2" fill="var(--ts-seal,#BE2A18)"/>
<g stroke="var(--ts-paper,#EDE1C6)" stroke-width="1.8" stroke-linecap="round">
<path d="M219 211h11M219 216h11M224.5 208v15"/>
</g>
</g>
</svg>
