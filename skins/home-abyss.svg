<path d="M52 560c-4-14-4-28 2-38h64c6 10 6 24 2 38z" fill="url(#abBrass)"/>
<circle cx="86" cy="510" r="34" fill="url(#abBrass)"/>
<circle cx="86" cy="510" r="34" fill="none" stroke="var(--hs-brass-lo,#77531f)" stroke-width="2" opacity=".7"/>
<circle cx="86" cy="512" r="18" fill="var(--hs-sea-2,#0c4e6c)"/>
<circle cx="86" cy="512" r="18" fill="none" stroke="var(--hs-brass-lo,#77531f)" stroke-width="3"/>
<path d="M74 504c6-5 14-6 20-4-8 1-14 5-16 12-3-3-4-6-4-8z" fill="#ffffff" opacity=".35"/>
<circle cx="52" cy="506" r="9" fill="url(#abBrass)"/>
<circle cx="52" cy="506" r="4" fill="var(--hs-sea-3,#04202f)" opacity=".7"/>
<circle cx="120" cy="506" r="9" fill="url(#abBrass)"/>
<circle cx="120" cy="506" r="4" fill="var(--hs-sea-3,#04202f)" opacity=".7"/>
<g fill="var(--hs-brass-lo,#77531f)" opacity=".8">
<circle cx="58" cy="548" r="3"/><circle cx="86" cy="552" r="3"/><circle cx="114" cy="548" r="3"/>
</g>
</g>

<!-- กระถางหินกับดอกไม้ทะเล (ขวา ฐานจบที่ y=644) -->
<g id="abAnemone">
