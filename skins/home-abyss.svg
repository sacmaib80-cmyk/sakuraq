<path d="M396 590c-3-22 0-36 6-46"/>
<path d="M408 590c2-22 8-34 16-42"/>
<path d="M418 590c6-16 12-24 20-28"/>
</g>
<g fill="var(--hs-anem-2,#ffc2d6)">
<circle cx="388" cy="548" r="4"/><circle cx="402" cy="544" r="4"/>
<circle cx="424" cy="548" r="4"/><circle cx="438" cy="562" r="4"/>
</g>
</g>

<!-- ฟองอากาศลอยขึ้น (สองมุม ไม่บังมาสคอต) -->
<g class="hsBubbles" fill="none" stroke="var(--hs-bub,#cdf6ff)" stroke-width="2.6">
<circle class="hsBubble hsBubble1" cx="176" cy="600" r="7" opacity=".7"/>
<circle class="hsBubble hsBubble2" cx="196" cy="600" r="4.5" opacity=".55"/>
<circle class="hsBubble hsBubble3" cx="162" cy="600" r="5.5" opacity=".6"/>
<circle class="hsBubble hsBubble4" cx="426" cy="600" r="6" opacity=".6"/>
