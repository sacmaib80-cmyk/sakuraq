<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 84" role="img" aria-label="Drifting jellyfish">
<!-- แมงกะพรุนเรืองแสง — ลอยอยู่ในน้ำของหน้าจับเวลา (อยู่ในวงกลมที่ถูกครอปแล้ว) -->
<defs>
<radialGradient id="tjGlow" cx=".5" cy=".38" r=".5">
<stop offset="0" stop-color="var(--tj-glow,#9ff0ff)" stop-opacity=".55"/>
<stop offset="1" stop-color="var(--tj-glow,#9ff0ff)" stop-opacity="0"/>
</radialGradient>
<linearGradient id="tjBell" x1="0" y1="0" x2=".3" y2="1">
<stop offset="0"   stop-color="var(--tj-bell-hi,#ffffff)" stop-opacity=".95"/>
<stop offset=".45" stop-color="var(--tj-bell,#a9e8ff)" stop-opacity=".85"/>
<stop offset="1"   stop-color="var(--tj-bell-lo,#5fb6d8)" stop-opacity=".7"/>
</linearGradient>
</defs>
<ellipse cx="30" cy="30" rx="30" ry="28" fill="url(#tjGlow)"/>
<!-- หนวด -->
<g class="tjTents" fill="none" stroke="var(--tj-tent,#bfefff)" stroke-width="2.2" stroke-linecap="round" opacity=".8">
<path d="M20 36c-3 12 2 18-1 30"/>
<path d="M26 38c-2 14 3 20 0 32"/>
<path d="M34 38c2 14-3 20 0 32"/>
<path d="M40 36c3 12-2 18 1 30"/>
</g>
<g fill="none" stroke="var(--tj-tent-2,#ffd6ee)" stroke-width="1.4" stroke-linecap="round" opacity=".65">
<path d="M23 37c-4 15 1 22-2 34M37 37c4 15-1 22 2 34"/>
</g>
<!-- โดม -->
<path d="M9 34c0-14 9-25 21-25s21 11 21 25c0 5-9 8-21 8S9 39 9 34z" fill="url(#tjBell)"/>
<path d="M14 30c1-10 8-17 16-17-8 4-12 10-13 19-2-1-3-2-3-2z" fill="#ffffff" opacity=".55"/>
<g fill="var(--tj-dot,#ffd6ee)" opacity=".85">
<circle cx="22" cy="26" r="2.2"/><circle cx="30" cy="22" r="2.6"/><circle cx="38" cy="26" r="2.2"/>
</g>
<path d="M11 34c4 4 12 6 19 6s15-2 19-6c0 5-9 8-19 8s-19-3-19-8z" fill="var(--tj-rim,#e8fbff)" opacity=".45"/>
</svg>
