<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Storm rain layer">
<!-- สายฝนหลังกระจกของหน้าจับเวลา
     ⚠️ ตั้งใจใช้ "เส้นสั้นๆ ซ้ำเป็นตาราง" ชุดเดียวกับฉากหน้า Home เป๊ะ ไม่ใช่ลายไล่เฉด
