<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Window frame timer skin">
<!-- หน้าจับเวลา "หน้าต่างที่ฝนกำลังจะซา" — กรอบหน้าต่างไม้ (กลางโปร่ง ตัวเลขเวลาอยู่ชั้นบน)
     ⚠️ จงใจเป็นสี่เหลี่ยม ไม่ใช่วงกลม — ธีมใต้ทะเลกับธีมนี้จะได้ไม่ใช่ของทรงเดียวกันคนละสี
     ⚠️ จงใจไม่มีคานแบ่งช่องกลางบาน เพราะตัวเลขเวลานั่งอยู่ตรงนั้นพอดี

     กลไกเวลาไม่ใช่ "เกจ" แต่เป็น "อากาศข้างนอกเปลี่ยน":
       เริ่มจับเวลา = พายุเต็มที่ ฟ้ามืด ฝนหนัก ต้นไม้เอนสู้ลม
       ใกล้หมดเวลา = ฝนซาลง ฟ้าสว่างขึ้น แดดอ่อนโผล่ ต้นไม้ตั้งตรง
     ทั้งหมดขับด้วย --rt-progress ในไฟล์ index.html (ดูบล็อก TIMER THEME: RAIN CLEARING) -->
<defs>
<linearGradient id="trWood" x1="0" y1="0" x2=".35" y2="1">
<stop offset="0"   stop-color="var(--tr-wood-hi,#a07a4c)"/>
<stop offset=".4"  stop-color="var(--tr-wood,#7d5731)"/>
<stop offset=".78" stop-color="var(--tr-wood-lo,#4a3018)"/>
<stop offset="1"   stop-color="var(--tr-wood-2,#6b4a28)"/>
</linearGradient>
<linearGradient id="trSill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0"   stop-color="var(--tr-sill-hi,#a37c4d)"/>
<stop offset=".45" stop-color="var(--tr-sill,#7f5a33)"/>
<stop offset="1"   stop-color="var(--tr-sill-lo,#4a3018)"/>
</linearGradient>
<linearGradient id="trBrass" x1="0" y1="0" x2="1" y2="1">
<stop offset="0"   stop-color="var(--tr-brass-hi,#f0d7a2)"/>
<stop offset=".55" stop-color="var(--tr-brass,#c39a56)"/>
<stop offset="1"   stop-color="var(--tr-brass-lo,#7a5824)"/>
</linearGradient>
</defs>

<!-- กรอบไม้ (โดนัท: นอกมนใน คมกลางโปร่ง) -->
<path fill-rule="evenodd" fill="url(#trWood)" d="M22 6h256a14 14 0 0 1 14 14v226a14 14 0 0 1-14 14H22a14 14 0 0 1-14-14V20A14 14 0 0 1 22 6zM26 24v218h248V24z"/>
<!-- ขอบใน: เส้นสว่างด้านบน/ซ้าย + เส้นเงาด้านล่าง/ขวา = กรอบดูมีความหนา -->
<g fill="none" stroke-width="2">
<path d="M26 24h248" stroke="var(--tr-wood-lo,#4a3018)" opacity=".75"/>
<path d="M26 24v218" stroke="var(--tr-wood-lo,#4a3018)" opacity=".6"/>
<path d="M26 242h248M274 24v218" stroke="var(--tr-wood-hi,#a07a4c)" opacity=".35"/>
</g>
<rect x="8" y="6" width="284" height="254" rx="14" fill="none" stroke="var(--tr-wood-lo,#4a3018)" stroke-width="2" opacity=".65"/>
<!-- เสี้ยนไม้บนกรอบ: เส้นสั้นตามยาวของแต่ละด้าน -->
<g stroke="var(--tr-wood-lo,#4a3018)" stroke-width="1.4" stroke-linecap="round" opacity=".28">
<path d="M40 14h64M132 15h58M206 13h52M40 251h58M124 252h66M206 250h54"/>
</g>
<g stroke="var(--tr-wood-lo,#4a3018)" stroke-width="1.4" stroke-linecap="round" opacity=".22">
<path d="M15 52v46M15 118v54M15 190v42M285 46v52M285 116v50M285 186v46"/>
</g>

<!-- หมุดทองเหลืองยึดมุมกรอบ -->
<g fill="url(#trBrass)">
<circle cx="18" cy="16" r="4.6"/><circle cx="282" cy="16" r="4.6"/>
<circle cx="18" cy="250" r="4.6"/><circle cx="282" cy="250" r="4.6"/>
</g>

<!-- กลอนหน้าต่างทองเหลือง (ริมขวากลางบาน) = ของที่บอกว่านี่คือหน้าต่างจริง ไม่ใช่กรอบรูป -->
<g>
<rect x="276" y="120" width="14" height="30" rx="4" fill="url(#trBrass)"/>
<rect x="279" y="126" width="8" height="18" rx="3" fill="var(--tr-brass-lo,#7a5824)" opacity=".55"/>
<circle cx="283" cy="135" r="3" fill="var(--tr-brass-hi,#f0d7a2)"/>
</g>

<!-- ขอบหน้าต่าง (ธรณี) -->
<rect x="0" y="258" width="300" height="20" rx="4" fill="url(#trSill)"/>
<rect x="0" y="258" width="300" height="4" rx="2" fill="var(--tr-sill-hi,#a37c4d)" opacity=".7"/>
<rect x="10" y="278" width="280" height="8" rx="3" fill="var(--tr-sill-lo,#4a3018)" opacity=".85"/>
<path d="M46 286h14l-8 12H40z" fill="var(--tr-sill-lo,#4a3018)" opacity=".8"/>
<path d="M240 286h14l-8 12h-14z" fill="var(--tr-sill-lo,#4a3018)" opacity=".8"/>
<!-- น้ำเกาะเป็นแนวบนธรณีหน้าต่าง -->
<g fill="var(--tr-bead,#dff2fa)" opacity=".35">
<circle cx="74" cy="262" r="2"/><circle cx="128" cy="263" r="1.6"/>
<circle cx="186" cy="262" r="1.8"/><circle cx="222" cy="263" r="1.4"/>
</g>

<!-- เงาขอบในกระจก: ทำให้รู้ว่ากระจกอยู่ลึกเข้าไปจากหน้ากรอบ -->
<rect x="26" y="24" width="248" height="218" fill="none" stroke="#04121b" stroke-width="12" opacity=".2"/>
</svg>
