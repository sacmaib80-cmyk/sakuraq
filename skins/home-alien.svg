<circle class="hsStar hsStar3" cx="424" cy="66"  r="1.3"/>
<circle class="hsStar hsStar2" cx="30"  cy="330" r="1.2"/>
<circle class="hsStar hsStar5" cx="72"  cy="392" r="1"/>
<circle class="hsStar hsStar4" cx="392" cy="330" r="1.4"/>
<circle class="hsStar hsStar6" cx="428" cy="392" r="1"/>
<circle class="hsStar hsStar1" cx="252" cy="300" r="1"/>
<circle class="hsStar hsStar3" cx="150" cy="330" r="1.1"/>
<circle class="hsStar hsStar2" cx="196" cy="404" r="1"/>
<circle class="hsStar hsStar5" cx="358" cy="416" r="1.2"/>
<circle class="hsStar hsStar4" cx="118" cy="60"  r="1.2"/>
<circle class="hsStar hsStar6" cx="366" cy="98"  r="1"/>
</g>

<!-- แสงเหนือ: 2 ริบบิ้น ไล่จากชมพูจางไปมิ้นต์ (ชมพูมีน้อยมากโดยตั้งใจ) -->
<g class="hsAurs">
<path class="hsAur hsAur1"
      d="M-60 214C40 150 122 250 216 190c94-60 168 30 292-38v-96C384 130 310 44 216 104 122 164 40 66-60 130z"
