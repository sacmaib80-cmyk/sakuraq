<path d="M0 612h440" stroke="var(--hs-mint,#5CF2C0)" stroke-width="2.4" opacity=".3"/>
<path d="M0 615h440" stroke="var(--hs-gnd-rim,#3E5486)" stroke-width="2" opacity=".55"/>

<!-- หลุมอุกกาบาตฝั่งซ้าย (ที่มาของตัวอย่างที่ยานมาเก็บ)
     ⚠️ วงรีเข้มเฉยๆ ตาจะอ่านเป็น "แอ่งน้ำ" (เคยพลาดมาแล้วกับก้อนหินในสวนซากุระ)
     -> ต้องมี "ขอบหลุมนูน" เป็นก้อนดินรอบปาก + ผนังหลุมฝั่งไกลรับแสง ถึงจะอ่านเป็นหลุม -->
