<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 860" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Alien planet surface at night">
<!-- พื้นผิวดาวต่างดาวยามค่ำ
     เส้นพื้น y=612 (มาสคอตนั่งที่ y 633-680 · กลางเท้า x=300 · เท้ากิน x 228-371)
     ของทุกชิ้นต้องมีฐานต่ำกว่าเส้นพื้น + มีเงา/แสงที่จุดสัมผัส ไม่งั้นตาจะอ่านว่า "ลอย"
     ตัวมาสคอตกินราว x 150-430 / y 360-680 -> ของสูงเกาะริมสองข้าง (x<180, x>370)
     ท้องฟ้าเหนือ y=350 ว่างหมด = ที่ของดาวเคราะห์/ดวงจันทร์/ยาน
     จุดเด่นมีจุดเดียว: ดาวเคราะห์วงแหวนสีอุ่น ตัดกับฟ้าเย็นทั้งภาพ (ที่เหลือเป็นมิ้นต์โทนเดียว)
     บนสุดอาจถูกครอปบนจอเตี้ย (xMidYMax) -> ห้ามวางของสำคัญเหนือ y=60 -->
<defs>
<linearGradient id="alSky" x1="0" y1="0" x2=".18" y2="1">
<stop offset="0"   stop-color="var(--hs-sky-1,#06091A)"/>
<stop offset=".42" stop-color="var(--hs-sky-2,#111838)"/>
<stop offset=".8"  stop-color="var(--hs-sky-3,#1E2853)"/>
<stop offset="1"   stop-color="var(--hs-sky-4,#2B3766)"/>
</linearGradient>
<linearGradient id="alHorizon" x1="0" y1="1" x2="0" y2="0">
<stop offset="0"   stop-color="var(--hs-mint,#5CF2C0)" stop-opacity=".26"/>
<stop offset="1"   stop-color="var(--hs-mint,#5CF2C0)" stop-opacity="0"/>
</linearGradient>
<linearGradient id="alAur" x1="0" y1="0" x2=".2" y2="1">
<stop offset="0"   stop-color="var(--hs-aur-2,#FF5FA8)" stop-opacity=".22"/>
<stop offset=".45" stop-color="var(--hs-mint,#5CF2C0)" stop-opacity=".3"/>
<stop offset="1"   stop-color="var(--hs-mint,#5CF2C0)" stop-opacity="0"/>
</linearGradient>
<radialGradient id="alPlanet" cx=".33" cy=".27" r=".78">
<stop offset="0"   stop-color="var(--hs-pl-hi,#FFDCAE)"/>
<stop offset=".34" stop-color="var(--hs-pl,#E8B478)"/>
<stop offset=".68" stop-color="var(--hs-pl-lo,#A56B45)"/>
<stop offset="1"   stop-color="var(--hs-pl-dk,#3E2A2C)"/>
</radialGradient>
<radialGradient id="alMoon" cx=".34" cy=".3" r=".76">
<stop offset="0"   stop-color="var(--hs-moon-hi,#E4EEFF)"/>
<stop offset=".55" stop-color="var(--hs-moon,#A9B8D4)"/>
<stop offset="1"   stop-color="var(--hs-moon-lo,#4C5878)"/>
</radialGradient>
<linearGradient id="alCrysA" x1="0" y1="0" x2=".9" y2="1">
<stop offset="0"   stop-color="var(--hs-cry-hi,#7FEFD2)"/>
<stop offset=".5"  stop-color="var(--hs-cry,#2E9A93)"/>
<stop offset="1"   stop-color="var(--hs-cry-lo,#123E51)"/>
</linearGradient>
<linearGradient id="alCrysB" x1="1" y1="0" x2=".2" y2="1">
<stop offset="0"   stop-color="var(--hs-cry,#2E9A93)"/>
<stop offset="1"   stop-color="var(--hs-cry-dk,#0C2A3E)"/>
</linearGradient>
<radialGradient id="alPool" cx=".5" cy=".5" r=".5">
<stop offset="0"   stop-color="var(--hs-mint,#5CF2C0)" stop-opacity=".42"/>
<stop offset="1"   stop-color="var(--hs-mint,#5CF2C0)" stop-opacity="0"/>
</radialGradient>
<linearGradient id="alBeam" x1="0" y1="0" x2="0" y2="1">
<stop offset="0"   stop-color="var(--hs-mint,#5CF2C0)" stop-opacity=".46"/>
<stop offset="1"   stop-color="var(--hs-mint,#5CF2C0)" stop-opacity="0"/>
</linearGradient>
<linearGradient id="alGround" x1="0" y1="0" x2="0" y2="1">
<stop offset="0"   stop-color="var(--hs-gnd-1,#1B2447)"/>
<stop offset=".35" stop-color="var(--hs-gnd-2,#101736)"/>
<stop offset="1"   stop-color="var(--hs-gnd-3,#080C22)"/>
</linearGradient>
<clipPath id="alPlanetClip"><circle cx="100" cy="250" r="68"/></clipPath>
<clipPath id="alSkyClip"><rect x="0" y="0" width="440" height="612"/></clipPath>
</defs>

<!-- ══════════ ท้องฟ้า ══════════ -->
<g clip-path="url(#alSkyClip)">
<rect x="0" y="0" width="440" height="612" fill="url(#alSky)"/>
<rect x="0" y="392" width="440" height="220" fill="url(#alHorizon)"/>

<!-- ดาว: 3 ขนาด กระจายไม่เป็นระเบียบ -->
