<g class="hsShoot">
<path d="M0 0l58-26" stroke="var(--hs-star,#DCE8FF)" stroke-width="2" stroke-linecap="round" fill="none" opacity=".9"/>
<circle cx="0" cy="0" r="2.1" fill="#ffffff"/>
</g>

<!-- ══════ ดาวเคราะห์วงแหวน = จุดเด่นของภาพ ══════
     วางค่อนล่าง-ซ้าย: เว้นที่โล่งให้การ์ดคะแนน+ปุ่ม CTA ที่ลอยอยู่ครึ่งบนของจอ
     และกันโดนครอปบนจอเตี้ย (ฉากตรึงขอบล่าง ยิ่งอยู่สูงยิ่งเสี่ยงหาย) -->
<g transform="rotate(-16 100 250)">
<!-- วงแหวนครึ่งหลัง -->
<path d="M-15 250A115 27 0 0 1 215 250" fill="none" stroke="var(--hs-ring,#E4C79C)" stroke-width="10" opacity=".5"/>
<path d="M-15 250A115 27 0 0 1 215 250" fill="none" stroke="var(--hs-ring-hi,#FFEDD2)" stroke-width="3" opacity=".55"/>
</g>

<circle cx="100" cy="250" r="68" fill="url(#alPlanet)"/>
<!-- แถบเมฆบนดาว (โค้งตามผิวทรงกลม) -->
<g clip-path="url(#alPlanetClip)" opacity=".38">
<path d="M16 218c36-14 90-14 134 4-46 11-93 11-134-4z" fill="var(--hs-pl-band,#8A5537)"/>
<path d="M14 259c41-11 97-9 140 7-50 9-100 7-140-7z" fill="var(--hs-pl-band,#8A5537)" opacity=".7"/>
<path d="M28 286c36-7 82-5 116 7-41 7-82 5-116-7z" fill="var(--hs-pl-band,#8A5537)" opacity=".5"/>
<path d="M34 192c29-9 70-7 100 5-36 5-72 4-100-5z" fill="var(--hs-pl-hi,#FFDCAE)" opacity=".35"/>
</g>
<!-- ขอบรับแสงบางๆ ด้านบน-ซ้าย -->
<path d="M100 182a68 68 0 0 0-64 46" fill="none" stroke="var(--hs-pl-hi,#FFDCAE)" stroke-width="2.2" opacity=".5"/>

<g transform="rotate(-16 100 250)">
<!-- วงแหวนครึ่งหน้า (พาดทับตัวดาว) -->
<path d="M-15 250A115 27 0 0 0 215 250" fill="none" stroke="var(--hs-ring,#E4C79C)" stroke-width="10" opacity=".72"/>
<path d="M-15 250A115 27 0 0 0 215 250" fill="none" stroke="var(--hs-ring-hi,#FFEDD2)" stroke-width="3" opacity=".85"/>
<path d="M-15 250A115 27 0 0 0 215 250" fill="none" stroke="var(--hs-sky-2,#111838)" stroke-width="1.2" opacity=".5"/>
</g>

<!-- ══════ ดวงจันทร์ดวงเล็ก ══════ -->
<g>
<circle cx="392" cy="92" r="21" fill="url(#alMoon)"/>
<g fill="var(--hs-moon-lo,#4C5878)" opacity=".45">
<circle cx="386" cy="86" r="4.6"/><circle cx="398" cy="100" r="3.2"/><circle cx="384" cy="101" r="2.2"/>
</g>
<path d="M392 71a21 21 0 0 0-19 12" fill="none" stroke="var(--hs-moon-hi,#E4EEFF)" stroke-width="1.6" opacity=".55"/>
</g>

<!-- ══════ ยานลำเล็กลอยไกลๆ (ผูกกับธีมหน้าจับเวลา) ══════ -->
<g class="hsUfo">
