<circle cx="318" cy="305" r="1.5" fill="var(--hs-mint-pale,#C9FFEE)"/>
<circle cx="330" cy="304" r="1.5" fill="var(--hs-mint-pale,#C9FFEE)"/>
</g>

<!-- ══════ ภูเขาไกล (มีหมอกคั่น = เกิดระยะ) ══════ -->
<path d="M-10 612V486l52-64 38 44 46-92 52 78 40-40 56 86 44-56 60 74 72-58v154z"
      fill="var(--hs-mtn-far,#28325F)" opacity=".85"/>
<rect x="0" y="470" width="440" height="142" fill="url(#alHorizon)" opacity=".55"/>

<!-- ภูเขาใกล้: ยอดเอียงแบบหินต่างดาว ไม่ใช่สามเหลี่ยมตรง -->
<path d="M-10 612V536l44-52 26 40 40-58 34 62 52-44 46 56 40-32 50 60 66-44 62 44v44z"
      fill="var(--hs-mtn-near,#141B3A)"/>
