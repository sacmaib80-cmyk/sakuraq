<path d="M58 700c9-6 20-7 25-2 4 4-2 8-12 8s-16-3-13-6z"/>
<path d="M120 701c9-6 21-6 26-1 4 4-3 8-13 8s-16-4-13-7z"/>
<path d="M158 691c8-6 17-7 22-3 4 4 0 8-8 8s-15-2-14-5z"/>
</g>
<g fill="var(--hs-rock-lit,#33427A)" opacity=".65">
<path d="M22 692c7-6 16-8 22-4-6-1-13 1-18 5z"/>
<path d="M120 701c9-6 21-6 26-1-7-2-16 0-22 3z"/>
</g>
</g>

<!-- ก้อนหินกระจาย (อยู่ในแถบที่มองเห็นจริง y 620-740 — ต่ำกว่านี้โดนแถบเมนูล่างบัง) -->
<g fill="var(--hs-rock,#1A2246)">
