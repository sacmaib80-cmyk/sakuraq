<path d="M174 492l46 56-30 4z" fill="var(--hs-mtn-lit,#2A3868)" opacity=".7"/>
<path d="M310 516l50 60-32 2z" fill="var(--hs-mtn-lit,#2A3868)" opacity=".6"/>
</g>

<!-- ══════════ พื้นดิน ══════════ -->
<rect x="0" y="612" width="440" height="248" fill="url(#alGround)"/>
