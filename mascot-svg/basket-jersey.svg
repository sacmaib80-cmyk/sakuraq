<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 720" data-outfit="basket" role="img" aria-label="Basketball jersey for the fox mascot">
<!--
  ชุดนักบาส — ยัดเข้าช่อง fx-outfit-* ของ fox.svg (viewBox เดียวกัน 956x720 วาดทับได้เลย)

  ═══ ทำไมรอบก่อนยัง "ไม่เหมือนหมาใส่อยู่" (user ตีกลับ) ═══
  1) เสื้อแคบกว่าลำตัว -> ขนม่วงโผล่เป็นริมทั้งสองข้าง ตาอ่านเป็นแผ่นผ้าแปะหน้าอก
     -> รอบนี้ขอบเสื้อไล่ตามเส้นลำตัวจริง เหลือระยะเข้ามาแค่ ~7 หน่วย (พอให้เส้นขอบตัวหมาอ่านออก)
        ลำตัว: M392,452 C346,534 340,610 358,648 C392,668 564,668 598,648 C616,610 610,534 564,452
        กว้างสุดที่ y=580 -> ซ้าย x349 ขวา x607 · เสื้อจึงกว้าง 356..600
  2) ผ้าไม่มีอะไรทับเลย = แผ่นแปะ -> วาด "สะโพก + ขาหน้า" ซ้ำทับเสื้อ (ก๊อป path จาก fx-legs)
     ตามลำดับเดิมเป๊ะ: สะโพกซ้าย > สะโพกขวา > ขาหน้าขวา > ขาหน้าซ้าย
     (ยกแค่สะโพกอย่างเดียวไม่ได้ -> สะโพกจะไปอยู่เหนือขาหน้า user จับได้ทันที)

  ═══ ที่ว่างจริงของเสื้อ (ตัวเลขที่คุมงานวาดทั้งไฟล์) ═══
  ขาบังลำตัวเกือบหมดตั้งแต่ y=552: สะโพก x296..436 / x520..660 · ขาหน้า x418..538
  -> แถบเสื้อที่มองเห็นเต็มความกว้างคือ y476..548 เท่านั้น (72 หน่วย) ลายทุกอย่างต้องอยู่ในนี้
  -> แต่ยังมี "ช่องระหว่างขาหน้า 2 ข้าง" (x~462..494 ที่ y620..660) ที่เสื้อโผล่ได้
     จึงลากชายเสื้อลงต่ำถึง y~650 ไม่ยกขึ้น เพื่อให้เห็นผ้าในช่องนั้น = อ่านเป็นเสื้อที่ห่มตัวอยู่จริง

  ═══ เพดานที่ห้ามข้าม ═══
  ขอบล่างของหัว (คาง/แก้ม):  x326->y424 · x352->446 · x408->464 · x478->468 · x548->464 · x630->424
  คอเสื้อเว้าถึง y=492 (ขลิบหนา 9 กินถึง ~497) -> ปุยอกครีมยังโผล่ระหว่างปากกับคอเสื้อ

  ไม่มีช่อง hat: user บอก "อะไรบนหัวหมาอ่ะแปลกๆ" -> ถอดสายคาดหัวออก
  (ช่องไหนไม่ประกาศ applyMascotOutfit จะคืนของเดิมให้เอง = ดอกซากุระในหูยังอยู่ครบ)
  id ทุกตัวขึ้นต้น bj* กันชนกับ furGrad/creamGrad ของ fox.svg
-->

<g data-slot="neck">
  <defs>
    <linearGradient id="bjCloth" x1=".12" y1="0" x2=".82" y2="1">
      <stop offset="0"   stop-color="#5E6BD8"/>
      <stop offset=".38" stop-color="#3D49B4"/>
      <stop offset=".78" stop-color="#2A3390"/>
      <stop offset="1"   stop-color="#1D2470"/>
    </linearGradient>
    <linearGradient id="bjTrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFBF0"/>
      <stop offset="1"   stop-color="#EBD8B4"/>
    </linearGradient>
    <linearGradient id="bjNum" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0"   stop-color="#FFFCF2"/>
      <stop offset=".6"  stop-color="#F6E4C0"/>
      <stop offset="1"   stop-color="#D9BE8C"/>
    </linearGradient>
    <clipPath id="bjBodyClip">
      <path d="M400 476C424 482 448 492 478 492s54-10 78-16c26 30 44 62 44 100 0 24-3 42-8 58-38 18-190 18-228 0-5-16-8-34-8-58 0-38 18-70 44-100Z"/>
    </clipPath>
  </defs>

  <!-- ตัวเสื้อ: ขอบข้างเดินตามลำตัว · คอเว้า V · ชายเสื้อโค้งตามพุง -->
  <path d="M400 476C424 482 448 492 478 492s54-10 78-16c26 30 44 62 44 100 0 24-3 42-8 58-38 18-190 18-228 0-5-16-8-34-8-58 0-38 18-70 44-100Z"
        fill="url(#bjCloth)"/>

  <g clip-path="url(#bjBodyClip)">
    <!-- ด้านรับแสง (ซ้ายบน ตรงกับ skullLight ของตัวหมาที่ส่องจากซ้ายบน) -->
    <path d="M400 480c-28 30-44 72-44 112 0 26 4 46 12 60l40 8c-16-60-14-124 12-180Z" fill="#8B96F2" opacity=".28"/>
    <!-- ด้านเงา (ขวาล่าง) -->
    <path d="M556 480c28 30 44 74 44 114 0 24-4 42-11 56l-48 10c20-62 18-126-11-180Z" fill="#141A5C" opacity=".3"/>
    <!-- เงาที่หัวทอดลงบนอกเสื้อ = ตัวที่ทำให้เสื้อ "อยู่ใต้หัว" ไม่ใช่ลอยอยู่หน้า -->
    <path d="M392 474c24 30 52 46 86 46s62-16 86-46c-6 26-38 48-86 48s-80-22-86-48Z" fill="#0E1247" opacity=".34"/>
    <!-- แถบข้างลำตัว (แถบกีฬา) -->
    <!-- แถบข้างลำตัว: ต้องเริ่มสูงถึง y~488 เพราะแถบเสื้อที่มองเห็นจริงคือ y476..548
         ถ้าเริ่มที่ 508 เหมือนเดิม จะเหลือให้เห็นแค่ 40 หน่วย อ่านไม่ออกว่าเป็นแถบกีฬา -->
    <path d="M366 488c-14 40-18 86-12 132l26 4c-8-48-4-98 12-132Z" fill="#E0562E" opacity=".9"/>
    <path d="M590 488c14 40 18 86 12 132l-26 4c8-48 4-98-12-132Z" fill="#E0562E" opacity=".9"/>
    <path d="M360 494c-12 38-16 80-11 122l8 1c-6-44-2-88 11-121Z" fill="#FFB48A" opacity=".55"/>
    <!-- รอยยับผ้าตรงชายเสื้อ -->
    <g fill="none" stroke="#171E63" stroke-width="5" stroke-linecap="round" opacity=".3">
      <path d="M418 566c8 16 10 28 8 40"/>
      <path d="M478 574c2 16 2 26 0 36"/>
      <path d="M538 566c-8 16-10 28-8 40"/>
    </g>
  </g>

  <!-- เลข 7: เงาส้มก่อน แล้วเลขครีมทับ ให้เลขนูนพ้นผ้า
       ⚠️ ที่ว่างจริงของเสื้อคือแถบ y476..548 เท่านั้น (ใต้นั้นโดนขาหน้า+สะโพกบังหมด)
          บน  = ขลิบคอหนา 9 กินถึง y~497   ล่าง = ขอบบนขาหน้าอยู่ y~548
       ⛔ เคยลองยืดเลขลงไปถึง y558 ให้ขาบังปลายเลข (คิดว่าจะเหมือนแขนบังเลขบนเสื้อจริง)
          -> ที่ขนาดนี้มันอ่านเป็น "ตัวเลขพัง" ไม่ใช่ "ถูกบัง" เพราะเห็นแต่ขีดบน
          เลขต้องโผล่ครบตัวเสมอ ต่อให้เตี้ยกว่าที่อยากได้ -->
  <path d="M455 507H513V523L487 547H465L493 523H455Z" fill="#8E2C0C" opacity=".55"/>
  <path d="M452 504H510V520L484 544H462L490 520H452Z" fill="url(#bjNum)"/>
  <path d="M452 504H510V520L484 544H462L490 520H452Z" fill="none" stroke="#E0562E" stroke-width="3.2" stroke-linejoin="round" opacity=".85"/>

  <!-- ขลิบคอ (ตัวที่ทำให้อ่านออกทันทีว่าเป็นเสื้อกีฬา ไม่ใช่แผ่นสีแปะ) -->
  <path d="M400 476C424 482 448 492 478 492s54-10 78-16"
        fill="none" stroke="url(#bjTrim)" stroke-width="9" stroke-linecap="round"/>
  <path d="M400 476C424 482 448 492 478 492s54-10 78-16"
        fill="none" stroke="#E0562E" stroke-width="3.4" stroke-linecap="round" opacity=".75"/>

  <!-- ชายเสื้อ: แถบครีม + เงาใต้ชาย ให้ผ้าดูลอยพ้นตัว (โค้งขึ้นกลางลำตัว = ผ้าคลุมพาดขาหน้า) -->
  <path d="M592 634c-38 18-190 18-228 0" fill="none" stroke="url(#bjTrim)" stroke-width="9" stroke-linecap="round"/>
  <path d="M590 645c-36 17-186 17-222 0" fill="none" stroke="#0E1247" stroke-width="7" stroke-linecap="round" opacity=".26"/>

  <!-- ขอบนอกเสื้อ: เส้นเดียวกับสีขอบตัวหมา (#453B76) ให้ชุดเป็นส่วนหนึ่งของงานวาดเดิม -->
  <path d="M400 476C424 482 448 492 478 492s54-10 78-16c26 30 44 62 44 100 0 24-3 42-8 58-38 18-190 18-228 0-5-16-8-34-8-58 0-38 18-70 44-100Z"
        fill="none" stroke="#2B2358" stroke-width="6" stroke-linejoin="round"/>

  <!-- ════════ สะโพกสองข้าง วาดซ้ำทับเสื้อ ════════
       ต้นขาอยู่หน้าเสื้อ เสื้อสอดอยู่ระหว่างขา = อ่านออกว่าสวมอยู่ ไม่ใช่แผ่นผ้าแปะ
       path/สี/ความหนาเส้น ก๊อปจาก fx-legs ใน fox.svg มาทั้งดุ้น ห้ามวาดใหม่
       (ถ้าวาดใหม่ ต้นขาจะเพี้ยนจากตัวจริงแล้วเห็นเป็นรอยต่อทันที)

       เงาใต้ชายเสื้อวาดก่อน เพื่อให้ผ้าดูสอดอยู่ "หลัง" ต้นขาจริงๆ -->
  <path d="M398 584c-16 20-24 42-26 64l30 6c2-26 8-50 18-66Z" fill="#0E1247" opacity=".2"/>
  <path d="M558 584c16 20 24 42 26 64l-30 6c-2-26-8-50-18-66Z" fill="#0E1247" opacity=".2"/>

  <path fill="url(#furGrad)" stroke="#453B76" stroke-width="7" stroke-linejoin="round"
        d="M 396,552 C 320,552 296,634 340,668 C 372,688 436,652 414,586 Z"/>
  <path d="M 414,590 C 434,622 398,666 364,676" fill="none" stroke="#453B76" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

  <path fill="url(#furGrad)" stroke="#453B76" stroke-width="7" stroke-linejoin="round"
        d="M 560,552 C 636,552 660,634 616,668 C 584,688 520,652 542,586 Z"/>
  <path d="M 542,590 C 522,622 558,666 592,676" fill="none" stroke="#453B76" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

  <!-- อุ้งเท้าหลังสองข้าง: ต้องวาดซ้ำด้วย ไม่งั้นต้นขาที่เพิ่งวาดทับจะไปบังเท้าของเดิม -->
  <path fill="url(#creamGrad)" stroke="#453B76" stroke-width="6" stroke-linejoin="round"
        d="M 336,662 C 336,632 392,632 392,662 C 392,686 336,686 336,662 Z"/>
  <line x1="354" y1="666" x2="354" y2="679" stroke="#453B76" stroke-width="3" stroke-linecap="round"/>
  <line x1="374" y1="666" x2="374" y2="679" stroke="#453B76" stroke-width="3" stroke-linecap="round"/>
  <path fill="url(#creamGrad)" stroke="#453B76" stroke-width="6" stroke-linejoin="round"
        d="M 564,662 C 564,632 620,632 620,662 C 620,686 564,686 564,662 Z"/>
  <line x1="582" y1="666" x2="582" y2="679" stroke="#453B76" stroke-width="3" stroke-linecap="round"/>
  <line x1="602" y1="666" x2="602" y2="679" stroke="#453B76" stroke-width="3" stroke-linecap="round"/>

  <!-- ════════ ขาหน้า 2 ข้าง วาดซ้ำต่อจากสะโพก ════════
       ลำดับต้องตรงกับ fx-legs เป๊ะ: สะโพกซ้าย > สะโพกขวา > ขาหน้าขวา > ขาหน้าซ้าย
       ไม่งั้นจะกลายเป็น "ขาหลังอยู่เหนือขาหน้า" ซึ่งผิดจากตัวจริง -->
  <path fill="url(#furGrad)" d="M 484,548 C 476,594 490,650 504,670 C 520,680 538,670 536,648 C 536,598 524,554 528,544 C 514,552 498,552 484,548 Z"/>
  <path fill="none" stroke="#453B76" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"
        d="M 484,548 C 476,594 490,650 504,670 C 520,680 538,670 536,648 C 536,598 524,554 528,544"/>
  <path fill="url(#sockShade)" pointer-events="none"
        d="M 484,548 C 476,594 490,650 504,670 C 520,680 538,670 536,648 C 536,598 524,554 528,544 C 514,552 498,552 484,548 Z"/>
  <path fill="url(#creamGrad)" stroke="#453B76" stroke-width="6" stroke-linejoin="round"
        d="M 492,662 C 492,642 540,642 540,662 C 540,686 492,686 492,662 Z"/>
  <line x1="508" y1="666" x2="508" y2="679" stroke="#453B76" stroke-width="3" stroke-linecap="round"/>
  <line x1="524" y1="666" x2="524" y2="679" stroke="#453B76" stroke-width="3" stroke-linecap="round"/>

  <path fill="url(#furGrad)" d="M 472,548 C 480,594 466,650 452,670 C 436,680 418,670 420,648 C 420,598 432,554 428,544 C 442,552 458,552 472,548 Z"/>
  <path fill="none" stroke="#453B76" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"
        d="M 472,548 C 480,594 466,650 452,670 C 436,680 418,670 420,648 C 420,598 432,554 428,544"/>
  <path fill="url(#sockShade)" pointer-events="none"
        d="M 472,548 C 480,594 466,650 452,670 C 436,680 418,670 420,648 C 420,598 432,554 428,544 C 442,552 458,552 472,548 Z"/>
  <path fill="url(#creamGrad)" stroke="#453B76" stroke-width="6" stroke-linejoin="round"
        d="M 464,662 C 464,642 416,642 416,662 C 416,686 464,686 464,662 Z"/>
  <line x1="432" y1="666" x2="432" y2="679" stroke="#453B76" stroke-width="3" stroke-linecap="round"/>
  <line x1="448" y1="666" x2="448" y2="679" stroke="#453B76" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>
